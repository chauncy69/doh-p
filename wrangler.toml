name = "doh-proxy"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 可选环境变量（也可在 Dashboard 或用 `wrangler secret put TOKEN` 设置）
[vars]
# 默认上游：预设名（cloudflare/google/quad9/adguard/opendns/alidns/dnspod）或完整 https URL
UPSTREAM = "cloudflare"
# 追加自定义上游，格式：名称=URL，多个用逗号分隔
# EXTRA_UPSTREAMS = "mydns=https://dns.example.com/dns-query"
# 访问令牌：设置后端点变为 /<TOKEN>/dns-query，防止被他人滥用。
# 支持多个令牌，逗号分隔，例如 "phone-abc123,laptop-xyz789"。
# 建议不要写在这里，改用 secret：  npx wrangler secret put TOKEN
# TOKEN = "change-me"
